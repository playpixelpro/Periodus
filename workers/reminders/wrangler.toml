name = "periodus-reminders"
main = "src/index.js"
compatibility_date = "2026-01-01"

# Subscriptions live in KV: key = subscriber id, value = {email, sendTime, unsubToken}.
# Create with:  wrangler kv namespace create SUBS
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

# Fire hourly; the handler sends to anyone whose local sendTime matches the hour.
[triggers]
crons = ["0 * * * *"]

[vars]
ALLOWED_ORIGINS = "https://periodus.app,http://localhost:5173"
APP_NAME = "Periodus"
FROM_EMAIL = "reminders@periodus.app"
# Set the Resend key as a secret:  wrangler secret put RESEND_API_KEY
