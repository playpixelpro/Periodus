name = "lunara-oauth-callback"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Keep these routes narrow so this Worker never takes over the rest of
# lunara.app. Query strings are not part of Cloudflare route matching.
routes = [
  { pattern = "lunara.app/auth/openrouter*", zone_name = "lunara.app" },
  { pattern = "lunara.app/.well-known/apple-app-site-association", zone_name = "lunara.app" },
  { pattern = "lunara.app/apple-app-site-association", zone_name = "lunara.app" },
  { pattern = "lunara.app/.well-known/assetlinks.json", zone_name = "lunara.app" },
]

[vars]
# Verified from the checked-in native project. Override these if signing or
# package identity changes.
APPLE_TEAM_ID = "R5R3ZS54LV"
APPLE_BUNDLE_ID = "com.playpixelpro.myperiod"
ANDROID_PACKAGE_NAME = "com.playpixelpro.myperiod"

# REQUIRED before Android App Links can verify. Set this to the SHA-256
# fingerprint(s) of the actual release/app-signing certificate, separated by
# commas. Never guess this value.
ANDROID_SHA256_CERT_FINGERPRINTS = ""
