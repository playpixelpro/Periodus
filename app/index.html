<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#16130B" />
    <script>
      try {
        var t = localStorage.getItem('periodus.theme')
        var ok = ['terminal','feminine','fierce-focus','luna-rose','opal-moon','luxe-silk','beach-sand'].indexOf(t) !== -1
        if (ok) {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Cormorant+Garamond:ital,wght@0,400..700;1,400..700&family=Inter:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>Periodus</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
