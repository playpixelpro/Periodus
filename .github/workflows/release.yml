name: Android Release

# Triggered by a version tag push (e.g. v0.1.0) or manual workflow dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for release (e.g. v0.1.0). If empty, uses git tag or commit short-sha.'
        required: false
        type: string

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build-and-release:
    name: Build signed APK & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Toolchain (Node 22 LTS + pnpm caching + JDK 17)
      # -----------------------------------------------------------------------
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # -----------------------------------------------------------------------
      # 3. Build web assets
      # -----------------------------------------------------------------------
      - name: Build web (native mode)
        run: pnpm --filter @periodus/app build:native

      # -----------------------------------------------------------------------
      # 4. Sync Capacitor into the Android project
      # -----------------------------------------------------------------------
      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android --no-build

      # -----------------------------------------------------------------------
      # 5. Decode signing keystore from GitHub secret (if configured)
      # -----------------------------------------------------------------------
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: app/android/app
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > periodus-release.jks

      # -----------------------------------------------------------------------
      # 6. Build release APK
      # -----------------------------------------------------------------------
      - name: Build release APK (Signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: app/android
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_PATH: app/periodus-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Build release APK (Unsigned fallback)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: app/android
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew assembleRelease

      # -----------------------------------------------------------------------
      # 7. Locate the APK
      # -----------------------------------------------------------------------
      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No release APK found!"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG="${{ inputs.version }}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="v0.0.0-${SHORT_SHA}"
          fi
          
          DEST="Periodus-${TAG}.apk"
          cp "$APK" "$DEST"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # 8. Shred the keystore file so it never leaks in artifacts
      # -----------------------------------------------------------------------
      - name: Remove keystore from workspace
        if: always()
        run: |
          if [ -f app/android/app/periodus-release.jks ]; then
            shred -u app/android/app/periodus-release.jks || true
          fi

      # -----------------------------------------------------------------------
      # 9. Create GitHub Release with APK asset
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: "Periodus ${{ steps.apk.outputs.tag }}"
          body: |
            ## What's new in ${{ steps.apk.outputs.tag }}

            See the commit history for a full list of changes.

            ### Installing the update
            1. Tap **Download** below to download `${{ steps.apk.outputs.dest }}`
            2. Open the downloaded file — Android will prompt you to install it
            3. If prompted, enable "Install unknown apps" for your file manager or browser, then retry

            > **Privacy note**: This APK is signed and verified on-device. Core data never leaves your phone.
          files: ${{ steps.apk.outputs.dest }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
